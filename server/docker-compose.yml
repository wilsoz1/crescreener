# Full open-source stack for one GPU box (1x A100 40GB works: ~7GB OCR + ~20GB Qwen AWQ).
# Boot the box, `docker compose up -d`, point the site at https://<box>/ via Caddy.
services:
  vllm-ocr:
    image: vllm/vllm-openai:unlimited-ocr-cu129
    command: --model baidu/Unlimited-OCR --served-model-name Unlimited-OCR --max-model-len 32768 --gpu-memory-utilization 0.25
    ports: ["8001:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  vllm-llm:
    image: vllm/vllm-openai:latest
    command: --model Qwen/Qwen3-32B-AWQ --max-model-len 32768 --gpu-memory-utilization 0.65
    ports: ["8002:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  gateway:
    build: .
    ports: ["8787:8787"]
    environment:
      OCR_BASE_URL: http://vllm-ocr:8000/v1
      LLM_BASE_URL: http://vllm-llm:8000/v1
      LLM_MODEL: Qwen/Qwen3-32B-AWQ
      SUPABASE_URL: https://ngmpmyuwacwbwtqtinos.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on: [vllm-ocr, vllm-llm]

  # HTTPS so the site (served over https) can call the gateway. Set CADDY_DOMAIN to a DNS
  # name pointing at the box (e.g. api.crescreener.com) before `docker compose up`.
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { CADDY_DOMAIN: ${CADDY_DOMAIN:-} }
    command: sh -c 'echo "$$CADDY_DOMAIN { reverse_proxy gateway:8787 }" > /etc/caddy/Caddyfile && caddy run --config /etc/caddy/Caddyfile'
    depends_on: [gateway]

volumes:
  hf-cache:
